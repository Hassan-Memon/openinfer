# Cloud model prices in USD per 1 million tokens.
#
# These are indicative list prices as published on provider pricing pages, last reviewed
# November 2026. Providers change prices; treat this as a default and override per backend in
# openinfer.yaml (`pricing:`) when it matters. Models with 0/0 are free tier endpoints.
# Local backends (echo, ollama, llamacpp, vllm) cost 0 unless you give them an amortised price.
providers:
  groq:
    llama-3.1-8b-instant: { input: 0.05, output: 0.08 }
