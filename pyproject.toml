[project]
name = "openinfer"
version = "0.1.0"
description = "One model, any hardware. An OpenAI-compatible inference runtime that routes each request local or cloud by privacy, latency and cost."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hassan Memon" }]
requires-python = ">=3.12"
keywords = ["llm", "inference", "openai-compatible", "llama.cpp", "ollama", "vllm", "router", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
# Real local inference on CPU / Metal / CUDA / ROCm through llama.cpp.
llamacpp = ["llama-cpp-python>=0.2.90", "huggingface-hub>=0.24"]
# Speech to text for /v1/audio/transcriptions.
whisper = ["faster-whisper>=1.0"]
# Prometheus /metrics endpoint.
metrics = ["prometheus-client>=0.20"]
# Postgres cost ledger instead of the default SQLite file.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
openinfer = "openinfer.cli:app"

[project.urls]
Homepage = "https://github.com/Hassan-Memon/openinfer"
Repository = "https://github.com/Hassan-Memon/openinfer"
Issues = "https://github.com/Hassan-Memon/openinfer/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "openai>=1.40",
  "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openinfer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM", "RUF", "BLE"]
ignore = ["RUF012", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
